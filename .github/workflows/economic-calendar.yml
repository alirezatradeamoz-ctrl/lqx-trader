name: Update Economic Calendar

on:
  push:
    paths:
      - "update_economic_calendar.py"
      - ".github/workflows/economic-calendar.yml"
  schedule:
    # GitHub Actions cron is UTC. Runs daily.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-calendar
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update calendar JSON
        env:
          CALENDAR_TIMEZONE: UTC
        run: python3 update_economic_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic-calendar.json

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "chore: update economic calendar"
            git push
          fi
